services:
  postgres:
    image: postgres:16-alpine
    container_name: gospots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gospots
      POSTGRES_PASSWORD: gospots_dev
      POSTGRES_DB: gospots
    ports:
      - "5432:5432"
    volumes:
      - gospots_pg_data:/var/lib/postgresql/data

volumes:
  gospots_pg_data:

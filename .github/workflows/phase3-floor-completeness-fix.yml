name: Phase 3 floor completeness fix

on:
  push:
    branches: [phase3-live-operations-v2]
    paths: [.github/workflows/phase3-floor-completeness-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-live-operations-v2
      - name: Add GuestCheck due and persist auto-extension history
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/modules/operations/live-operations.service.ts')
          text = service.read_text()

          old = '''    const currentSegmentMinor = this.currentSegmentAmount(session, now, openStopPauseSeconds);\n    const accruedMinor = session.accruedBeforeCurrentSegmentMinor + currentSegmentMinor;\n    const updated = await this.prisma.$transaction(async (tx) => {'''
          new = '''    const currentSegmentMinor = this.currentSegmentAmount(session, now, openStopPauseSeconds);\n    const accruedMinor = session.accruedBeforeCurrentSegmentMinor + currentSegmentMinor;\n    const timingAtEnd = projectSessionTiming({\n      now,\n      startedAt: session.startedAt,\n      status: session.status,\n      pausedAt: session.pausedAt,\n      totalPausedSeconds: session.totalPausedSeconds,\n      pauseBillingMode: session.pauseBillingMode,\n      scheduledEndAt: session.scheduledEndAt,\n      autoExtend: session.autoExtend,\n      extensionMinutes: session.extensionMinutes,\n      warningMinutes: session.warningMinutes,\n      maxPauseMinutes: session.maxPauseMinutes,\n    });\n    const projectedAutoExtensions = timingAtEnd.autoExtensionCountProjected;\n    const updated = await this.prisma.$transaction(async (tx) => {'''
          if old not in text:
              raise SystemExit('finish insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''        accruedMinor,\n        ...(openStopPauseSeconds > 0 && {'''
          new = '''        accruedMinor,\n        ...(projectedAutoExtensions > 0 && {\n          extensionCount: { increment: projectedAutoExtensions },\n          scheduledEndAt: timingAtEnd.effectiveScheduledEndAt,\n        }),\n        ...(openStopPauseSeconds > 0 && {'''
          if old not in text:
              raise SystemExit('finish persistence anchor not found')
          text = text.replace(old, new, 1)

          old = '''      accruedMinor,\n      currency: session.currency,\n    });'''
          new = '''      accruedMinor,\n      currency: session.currency,\n      autoExtensions: projectedAutoExtensions,\n      effectiveScheduledEndAt: timingAtEnd.effectiveScheduledEndAt?.toISOString() ?? null,\n    });'''
          if old not in text:
              raise SystemExit('finish audit anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const [orders, customers, memberships] = await Promise.all([\n      sessionIds.length || guestCheckIds.length'''
          new = '''    const [orders, guestChecks, customers, memberships] = await Promise.all([\n      sessionIds.length || guestCheckIds.length'''
          if old not in text:
              raise SystemExit('floor destructuring anchor not found')
          text = text.replace(old, new, 1)

          old = '''        : Promise.resolve([]),\n      customerIds.length\n        ? this.prisma.customerProfile.findMany({'''
          new = '''        : Promise.resolve([]),\n      guestCheckIds.length\n        ? this.prisma.guestCheck.findMany({\n            where: { shopId, id: { in: guestCheckIds } },\n            select: { id: true, amountDue: true, currency: true },\n          })\n        : Promise.resolve([]),\n      customerIds.length\n        ? this.prisma.customerProfile.findMany({'''
          if old not in text:
              raise SystemExit('guest check query anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const customerMap = new Map(customers.map((row) => [row.id, row]));\n    const membershipMap = new Map(memberships.map((row) => [row.id, row]));'''
          new = '''    const guestCheckMap = new Map(guestChecks.map((row) => [row.id, row]));\n    const customerMap = new Map(customers.map((row) => [row.id, row]));\n    const membershipMap = new Map(memberships.map((row) => [row.id, row]));'''
          if old not in text:
              raise SystemExit('map anchor not found')
          text = text.replace(old, new, 1)

          old = '''            openOrderAmountMinor,\n            openOrderCount: sessionOrders.length,\n          },'''
          new = '''            openOrderAmountMinor,\n            openOrderCount: sessionOrders.length,\n            openCheckAmountDueMinor: session.guestCheckId\n              ? majorToMinor(guestCheckMap.get(session.guestCheckId)?.amountDue ?? null)\n              : null,\n            openCheckCurrency: session.guestCheckId\n              ? guestCheckMap.get(session.guestCheckId)?.currency ?? session.currency\n              : null,\n          },'''
          if old not in text:
              raise SystemExit('floor return anchor not found')
          text = text.replace(old, new, 1)
          service.write_text(text)

          client = Path('apps/web/src/lib/operations-offline-client.ts')
          text = client.read_text()
          old = '''  openOrderAmountMinor?: number;\n  openOrderCount?: number;\n  version: number;'''
          new = '''  openOrderAmountMinor?: number;\n  openOrderCount?: number;\n  openCheckAmountDueMinor?: number | null;\n  openCheckCurrency?: string | null;\n  version: number;'''
          if old not in text:
              raise SystemExit('offline type anchor not found')
          client.write_text(text.replace(old, new, 1))

          page = Path('apps/web/src/app/(tenant)/dashboard/[venuePath]/operations/page.tsx')
          text = page.read_text()
          old = '''                      {(session.openOrderCount ?? 0) > 0 ? <p className="text-xs text-fuchsia-200">Open orders: {session.openOrderCount} · {money(session.openOrderAmountMinor, session.currency)}</p> : null}\n                      {(session.alerts ?? session.timer?.alerts ?? []).length ?'''
          new = '''                      {(session.openOrderCount ?? 0) > 0 ? <p className="text-xs text-fuchsia-200">Open orders: {session.openOrderCount} · {money(session.openOrderAmountMinor, session.currency)}</p> : null}\n                      {session.openCheckAmountDueMinor != null ? <p className="text-xs text-emerald-200">Check due: {money(session.openCheckAmountDueMinor, session.openCheckCurrency ?? session.currency)}</p> : null}\n                      {(session.alerts ?? session.timer?.alerts ?? []).length ?'''
          if old not in text:
              raise SystemExit('floor UI anchor not found')
          page.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch and remove staging workflow
        run: |
          rm .github/workflows/phase3-floor-completeness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/operations/live-operations.service.ts apps/web/src/lib/operations-offline-client.ts apps/web/src/app/'(tenant)'/dashboard/'[venuePath]'/operations/page.tsx .github/workflows/phase3-floor-completeness-fix.yml
          git diff --cached --check
          git commit -m "fix(phase3): complete floor check and extension history"
          git push origin HEAD:phase3-live-operations-v2

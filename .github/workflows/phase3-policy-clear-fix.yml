name: Phase 3 optional pause-policy reset fix

on:
  push:
    branches: [phase3-live-operations-v2]
    paths: [.github/workflows/phase3-policy-clear-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-live-operations-v2
      - name: Allow max-pause policy to be cleared
        run: |
          python - <<'PY'
          from pathlib import Path
          dto = Path('apps/api/src/modules/operations/dto/operations.dto.ts')
          text = dto.read_text()
          old = '  @IsOptional() @Type(() => Number) @IsInt() @Min(1) @Max(1440) maxPauseMinutes?: number;'
          new = '  @IsOptional() @Type(() => Number) @IsInt() @Min(1) @Max(1440) maxPauseMinutes?: number | null;'
          if old not in text:
              raise SystemExit('max pause DTO anchor not found')
          dto.write_text(text.replace(old, new, 1))

          page = Path('apps/web/src/app/(tenant)/dashboard/[venuePath]/operations/page.tsx')
          text = page.read_text()
          old = '          ...(policy.maxPauseMinutes ? { maxPauseMinutes: policy.maxPauseMinutes } : {}),'
          new = '          maxPauseMinutes: policy.maxPauseMinutes ?? null,'
          if old not in text:
              raise SystemExit('max pause UI anchor not found')
          page.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch and remove staging workflow
        run: |
          rm .github/workflows/phase3-policy-clear-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/operations/dto/operations.dto.ts apps/web/src/app/'(tenant)'/dashboard/'[venuePath]'/operations/page.tsx .github/workflows/phase3-policy-clear-fix.yml
          git diff --cached --check
          git commit -m "fix(phase3): allow optional pause limit reset"
          git push origin HEAD:phase3-live-operations-v2

name: Phase 3 live-operations validation

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: phase3-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-operations:
    name: Live floor · migration · busy-shift gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: phase3_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d phase3_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/phase3_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate
      - name: Apply complete migration chain to clean Postgres
        working-directory: apps/api
        run: |
          set -euo pipefail
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status
          pnpm exec prisma validate
      - name: Assert Phase 3 live-operations schema and integrity
        working-directory: apps/api
        run: pnpm exec tsx prisma/phase3-live-operations-assert.ts
      - name: Run Phase 3 live-operations tests
        working-directory: apps/api
        run: pnpm exec jest --config jest.config.cjs --runInBand src/modules/operations/operations.service.spec.ts src/modules/operations/live-operations.service.spec.ts
      - name: Build API with generated Phase 3 contracts
        working-directory: apps/api
        run: pnpm run build

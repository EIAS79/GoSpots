name: Phase 8 live provider evidence relay

on:
  workflow_run:
    workflows:
      - Phase 8 live provider acceptance
    types:
      - completed

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download acceptance evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /tmp/phase8-evidence
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "phase8-live-provider-acceptance-$RUN_ID" \
            --dir /tmp/phase8-evidence

      - name: Comment exact result on Phase 8 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "### One-shot Phase 8 live-provider evidence"
            echo
            echo "- Workflow run: $RUN_ID"
            echo "- Conclusion: \`$CONCLUSION\`"
            echo "- Run: $HTML_URL"
            echo
            echo '```json'
            cat /tmp/phase8-evidence/phase8-live-provider-acceptance.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment 64 --repo "${{ github.repository }}" --body-file /tmp/comment.md

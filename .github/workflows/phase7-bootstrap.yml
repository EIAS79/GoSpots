name: Phase 7 bootstrap

on:
  push:
    branches: [phase-7/inventory-completion]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[phase7-bootstrap-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: phase-7/inventory-completion
          fetch-depth: 0
      - name: Verify and materialize Phase 7 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .phase7-bootstrap/part* > /tmp/phase7.b64
          base64 -d /tmp/phase7.b64 > /tmp/phase7.tar.gz
          echo '052ff196ab0da118d3521cf557e17d10019837274c2ef0ed0723445779f9521e  /tmp/phase7.tar.gz' | sha256sum -c -
          tar -xzf /tmp/phase7.tar.gz -C .
          rm -rf .phase7-bootstrap
          rm -f .github/workflows/phase7-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'phase7: implement inventory purchasing costing and controls [phase7-bootstrap-applied]'
          git push origin HEAD:phase-7/inventory-completion

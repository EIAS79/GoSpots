name: Chunk 01 schema patch

on:
  push:
    branches:
      - agent/gospots-00-repository-baseline
    paths:
      - .github/scripts/chunk01-schema-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gospots-00-repository-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply idempotent Prisma schema patch
        run: node .github/scripts/chunk01-schema-patch.mjs
      - name: Commit schema patch
        shell: bash
        run: |
          if git diff --quiet -- apps/api/prisma/schema.prisma; then
            echo "Schema already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/schema.prisma
          git commit -m "Add Chunk 01 foundation schema models"
          git push origin HEAD:agent/gospots-00-repository-baseline

name: Phase 16 dependency lock sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/package.json'
      - 'apps/web/package.json'
      - '.github/workflows/phase16-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'phase-16/production-hardening-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-16/production-hardening-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Resolve patched dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(phase16): sync patched dependency lockfile'
          git push origin HEAD:phase-16/production-hardening-v2

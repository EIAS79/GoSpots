name: Phase 4 production acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/acceptance/phase4-production-trigger.txt

permissions:
  contents: read

concurrency:
  group: phase4-production-acceptance
  cancel-in-progress: true

jobs:
  production-gate-p4:
    name: Production Gate P4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOSPOTS_BASE_URL: https://www.gospots.eu/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production readiness
        shell: bash
        run: |
          set -euo pipefail
          last=''
          for i in {1..120}; do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$GOSPOTS_BASE_URL/ready" || true)
            last=$(cat /tmp/ready.json 2>/dev/null || true)
            if [ "$code" = "200" ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/ready.json','utf8')); process.exit(x.status==='ok'?0:1)"; then
              cat /tmp/ready.json
              exit 0
            fi
            echo "readiness attempt $i -> HTTP $code"
            sleep 5
          done
          echo "Production never became ready: $last" >&2
          exit 1

      - name: Run isolated production Gate P4
        run: node scripts/phase4-production-acceptance.mjs

      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase4-production-acceptance-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: /tmp/phase4-production-acceptance.json

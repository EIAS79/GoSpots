name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Lint (baseline advisory)
        continue-on-error: true
        run: pnpm run lint

      - name: Test
        run: pnpm exec jest --config jest.config.cjs --runInBand
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Build
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          pnpm run build 2>&1 | tee /tmp/api-build.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+\.ts):([0-9]+):([0-9]+).*error\ TS([0-9]+):[[:space:]]*(.*)$ ]]; then
              file="${BASH_REMATCH[1]}"
              lineno="${BASH_REMATCH[2]}"
              col="${BASH_REMATCH[3]}"
              code="${BASH_REMATCH[4]}"
              message="${BASH_REMATCH[5]}"
              echo "::error file=${file},line=${lineno},col=${col}::TS${code}: ${message}"
            fi
          done < /tmp/api-build.log
          exit "$status"
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

  api-migrate:
    name: API migrate dry-run (ephemeral Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Migrate deploy (empty DB)
        run: pnpm exec prisma migrate deploy
      - name: Migrate status (no pending)
        run: pnpm exec prisma migrate status
      - name: Prisma validate
        run: pnpm exec prisma validate

  web:
    name: Web checkout + offline tests · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SITE_URL: https://www.gospots.eu
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: https://gospots-api.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Checkout UI tests
        run: pnpm run test:checkout
      - name: Offline Lite tests
        run: pnpm run test:offline
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        if: ${{ always() }}
        run: pnpm run build

  edge:
    name: Edge Hub test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: node --test test/*.test.js
      - name: Build
        run: node --check src/canonical.js && node --check src/crypto.js && node --check src/store.js && node --check src/cloud-client.js && node --check src/hub.js && node --check src/server.js

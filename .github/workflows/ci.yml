name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API changed-lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      # The repository enters Chunk 00 with substantial pre-existing API lint
      # debt. Ratchet it: changed TypeScript must be clean, while the full debt
      # remains visible/documented and can be burned down separately without
      # mixing hundreds of unrelated edits into this safety PR.
      - name: Lint changed API TypeScript
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'apps/api/**/*.ts' \
              | sed 's#^apps/api/##'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed API TypeScript files."
            exit 0
          fi
          printf 'Linting changed files:\n%s\n' "${files[*]}"
          pnpm exec eslint "${files[@]}"

      - name: Test
        if: ${{ always() }}
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Build
        if: ${{ always() }}
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

  api-migrate:
    name: API migrate dry-run (ephemeral Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Migrate deploy (empty DB)
        run: pnpm exec prisma migrate deploy

      - name: Migrate status (no pending)
        run: pnpm exec prisma migrate status

      - name: Prisma validate
        run: pnpm exec prisma validate

  web:
    name: Web typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # next.config.ts intentionally requires an absolute non-local target for
      # production builds that use the same-origin /api/v1 proxy. CI validates
      # configuration/buildability only; it does not send traffic to this host.
      API_PROXY_TARGET: https://ci-api.invalid
      NEXT_PUBLIC_API_BASE_URL: /api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        if: ${{ always() }}
        run: pnpm run build

name: Phase 17 pilot certification and release gate

on:
  pull_request:
    paths:
      - '.github/workflows/phase17-validation.yml'
      - 'docs/acceptance/phase-17-**'
      - 'docs/program/phase17-**'
      - 'docs/operations/PHASE17_**'
      - 'apps/web/e2e/**'
      - 'apps/edge/**'
      - 'apps/api/src/modules/**'
      - 'apps/api/prisma/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase17-validation.yml'
      - 'docs/acceptance/phase-17-**'
      - 'docs/program/phase17-**'
      - 'docs/operations/PHASE17_**'
      - 'apps/web/e2e/**'
      - 'apps/edge/**'
      - 'apps/api/src/modules/**'
      - 'apps/api/prisma/**'

permissions:
  contents: read

jobs:
  release-integrity:
    name: Phase 17 gate · security · migrations · reconciliation · DR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gospots_p17
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gospots_p17"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gospots_p17?schema=public
      GOSPOTS_E2E_DB: 'true'
      JWT_ACCESS_SECRET: phase17-ci-access-secret-not-production
      NODE_ENV: test
      TENANT_RLS: 'off'
      ADYEN_TERMINAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject high and critical production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Generate validate and deploy clean PostgreSQL 17 chain
        run: |
          pnpm --dir apps/api exec prisma generate
          pnpm --dir apps/api exec prisma validate
          pnpm --dir apps/api exec prisma migrate deploy
          pnpm --dir apps/api exec prisma migrate status
      - name: Certify Adyen terminal payment and refund adapter semantics
        run: >-
          pnpm --dir apps/api exec jest --config jest.config.cjs --runInBand
          src/modules/device-payment/connectors/adyen-terminal.connector.spec.ts
          src/modules/device-payment/adyen-terminal-webhook.controller.spec.ts
          src/modules/device-payment/payment-domain.service.spec.ts
          src/modules/device-payment/payment-operation-state.service.spec.ts
      - name: Seed release-certification data
        run: pnpm --dir apps/api exec tsx prisma/e2e-seed.ts > /tmp/phase17-seed.json
      - name: Assert realistic billiard pilot profile
        shell: bash
        run: |
          set -euo pipefail
          count=$(docker run --rm --network host -e PGPASSWORD=ci postgres:17 \
            psql -h 127.0.0.1 -U ci -d gospots_p17 -Atc \
            "SELECT count(*) FROM \"Resource\" WHERE \"shopId\" = 'e2e-shop-gaming' AND \"type\" = 'BILLIARD';")
          test "$count" -ge 8
          test "$count" -le 20
          echo "Pilot A billiard resources: $count" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove money reconciliation authority
        run: pnpm --dir apps/api exec tsx prisma/phase14-integrity-assert.ts
      - name: Re-run production-sized analytics performance target
        run: pnpm --dir apps/api exec tsx prisma/phase14-performance-benchmark.ts
      - name: Re-run cash close and high-risk financial contracts
        run: >-
          pnpm --dir apps/api exec jest --config jest.config.cjs --runInBand
          src/modules/cash/cash-close.service.spec.ts
          src/modules/cash/cash.service.spec.ts
      - name: Re-run Edge outage and print continuity certification
        run: >-
          node --test
          apps/edge/test/phase12-continuity.test.js
          apps/edge/test/phase12-full-outage-drill.test.js
          apps/edge/test/printing.test.js
      - name: Perform independent logical backup restore drill
        shell: bash
        run: |
          set -euo pipefail
          client=(docker run --rm --network host -i -e PGPASSWORD=ci postgres:17)
          count_sql='SELECT concat_ws('"'"'|'"'"', (SELECT count(*) FROM "User"), (SELECT count(*) FROM "Shop"), (SELECT count(*) FROM "Reservation"), (SELECT count(*) FROM "_prisma_migrations"));'
          source_counts="$(${client[@]} psql -h 127.0.0.1 -U ci -d gospots_p17 -Atc "$count_sql")"
          started=$(date +%s)
          ${client[@]} pg_dump -h 127.0.0.1 -U ci -d gospots_p17 -Fc > /tmp/gospots-phase17.dump
          ${client[@]} createdb -h 127.0.0.1 -U ci gospots_p17_restore
          cat /tmp/gospots-phase17.dump | ${client[@]} pg_restore -h 127.0.0.1 -U ci -d gospots_p17_restore --no-owner --no-privileges
          restored_counts="$(${client[@]} psql -h 127.0.0.1 -U ci -d gospots_p17_restore -Atc "$count_sql")"
          test "$source_counts" = "$restored_counts"
          restore_seconds=$(( $(date +%s) - started ))
          test "$restore_seconds" -lt 7200
          echo "source=$source_counts restored=$restored_counts seconds=$restore_seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release integrity diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase17-release-integrity-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            /tmp/phase17-seed.json
            /tmp/gospots-phase17.dump

  pilot-e2e:
    name: Phase 17 gate · full permanent browser release suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gospots_p17_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gospots_p17_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gospots_p17_e2e?schema=public
      GOSPOTS_E2E_DB: 'true'
      JWT_ACCESS_SECRET: phase17-e2e-access-secret-not-production
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      WEB_APP_URL: http://127.0.0.1:3000
      WEB_ORIGIN: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000
      THROTTLE_DISABLED: 'true'
      LEGACY_UPLOADS_STATIC: 'false'
      TENANT_RLS: 'off'
      E2E_FAKE_PAYMENT_ENABLED: 'true'
      ADYEN_TERMINAL_ENABLED: 'false'
      STRIPE_TERMINAL_ENABLED: 'false'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://127.0.0.1:4000
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated release database
        run: |
          pnpm --dir apps/api exec prisma generate
          pnpm --dir apps/api exec prisma migrate deploy
          pnpm --dir apps/api exec prisma migrate status
          pnpm --dir apps/api exec tsx prisma/e2e-seed.ts > /tmp/phase17-e2e-seed.json
      - name: Build API and web
        run: |
          pnpm --dir apps/api run build
          pnpm --dir apps/web run build
      - name: Install Playwright Chromium
        working-directory: apps/web/e2e
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install chromium
      - name: Start API and web
        shell: bash
        run: |
          set -euo pipefail
          nohup env NODE_ENV=test PORT=4000 pnpm --dir apps/api run start:prod > /tmp/phase17-api.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/api/v1/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/api/v1/ready >/dev/null
          nohup pnpm --dir apps/web run start --hostname 127.0.0.1 --port 3000 > /tmp/phase17-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/login >/dev/null
      - name: Run permanent pilot and integrity browser suite without flaky acceptance
        working-directory: apps/web/e2e
        run: npx playwright test --fail-on-flaky-tests
      - name: Assert persisted canonical results
        run: pnpm --dir apps/api exec tsx prisma/e2e-assert.ts
      - name: Upload pilot diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase17-pilot-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
            /tmp/phase17-api.log
            /tmp/phase17-web.log
            /tmp/phase17-e2e-seed.json

  release-contract:
    name: Phase 17 gate · release policy completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require pilot, opening, external, provider, tiers and rollback contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/program/phase17-requirements-matrix.md
          test -s docs/acceptance/phase-17-pilot-certification-go-live-v2.md
          test -s docs/acceptance/phase-17-adyen-terminal-certification.md
          test -s docs/operations/PHASE17_GO_LIVE_RUNBOOK.md
          grep -q 'Pilot A' docs/program/phase17-requirements-matrix.md
          grep -q 'Pilot B' docs/program/phase17-requirements-matrix.md
          grep -q 'Pilot C' docs/program/phase17-requirements-matrix.md
          grep -q 'Opening checklist' docs/operations/PHASE17_GO_LIVE_RUNBOOK.md
          grep -q 'Design partner' docs/operations/PHASE17_GO_LIVE_RUNBOOK.md
          grep -q 'General availability' docs/operations/PHASE17_GO_LIVE_RUNBOOK.md
          grep -q 'Rollback' docs/operations/PHASE17_GO_LIVE_RUNBOOK.md
          grep -q 'Adyen Terminal API' docs/acceptance/phase-17-adyen-terminal-certification.md
          grep -q 'BLOCKED_EXTERNAL' docs/acceptance/phase-17-pilot-certification-go-live-v2.md

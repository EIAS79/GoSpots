name: Chunk 04 integration patch

on:
  push:
    branches:
      - feat/chunk04-split-merge-settlement

permissions:
  contents: write

jobs:
  patch-schema:
    if: ${{ !contains(github.event.head_commit.message, '[schema-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chunk 04 integration files
        run: node .github/scripts/chunk04-schema-patch.mjs
      - name: Commit generated integration patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Chunk 04 integration already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/prisma/schema.prisma \
            apps/api/src/common/idempotency.util.ts \
            apps/api/src/modules/checkout/checkout.module.ts \
            apps/api/src/modules/foundation/feature-flag.service.ts
          git commit -m "Patch Chunk 04 integration files [schema-patch]"
          git push

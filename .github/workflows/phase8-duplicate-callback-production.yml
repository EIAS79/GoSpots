name: Phase 8 duplicate callback production proof

on:
  push:
    branches: [main]
    paths:
      - docs/acceptance/phase8-duplicate-callback-trigger.txt

permissions:
  contents: read
  issues: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Replay production reconciliation twice
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://www.gospots.eu/api/v1';
          const sessionId = 'cs_live_a13NfVGQRENMa9theCfpb6LToAgJDrpZ3Gv7z23mWb8gAD4yx7Mb51kuO4';
          const out = { startedAt: new Date().toISOString(), sessionId, replays: [] };
          async function reconcile() {
            const response = await fetch(`${base}/public/growth/reservation-deposits/reconcile`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({ sessionId }),
            });
            const text = await response.text();
            let body; try { body = JSON.parse(text); } catch { body = text; }
            return { status: response.status, body };
          }
          async function main() {
            const first = await reconcile();
            const second = await reconcile();
            out.replays.push(first, second);
            for (const [i, result] of out.replays.entries()) {
              if (result.status < 200 || result.status >= 300) throw new Error(`replay ${i + 1} HTTP ${result.status}: ${JSON.stringify(result.body)}`);
              if (result.body?.attemptStatus !== 'SUCCEEDED' || result.body?.reconciled !== true) throw new Error(`replay ${i + 1} not reconciled: ${JSON.stringify(result.body)}`);
              if (Number(result.body?.balanceMinor) !== 0 || Number(result.body?.ledgerEntries) !== 2) throw new Error(`replay ${i + 1} changed final ledger summary: ${JSON.stringify(result.body)}`);
            }
            out.result = 'PASS';
          }
          main().catch((e) => { out.result = 'FAIL'; out.error = e instanceof Error ? e.message : String(e); process.exitCode = 1; }).finally(() => { out.finishedAt = new Date().toISOString(); fs.writeFileSync('/tmp/phase8-duplicate-callback.json', JSON.stringify(out, null, 2)); });
          NODE

      - name: Record proof on Phase 8 issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Phase 8 duplicate signed-callback production proof'
            echo
            echo 'The production reconciliation implementation now deliberately routes paid/complete sessions through the same signed Stripe webhook handler even after the attempt is already SUCCEEDED. These two calls therefore exercise duplicate callback handling against the production provider record.'
            echo
            echo '```json'
            cat /tmp/phase8-duplicate-callback.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment 64 --repo "${{ github.repository }}" --body-file /tmp/comment.md

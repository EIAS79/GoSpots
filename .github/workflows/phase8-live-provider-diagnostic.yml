name: Phase 8 live provider diagnostic

on:
  push:
    branches: [main]
    paths:
      - docs/acceptance/phase8-live-provider-diagnostic-trigger.txt

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose production acceptance auth and deposit read path
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://www.gospots.eu/api/v1';
          const email = 'p4-31919110371-0vl9xk@gospots.local';
          const password = 'P4-Accept-31919110371!Aa9';
          const venuePath = 'neon-billiard';
          const reservationId = 'cmsvr1yv90001go1g9iobvg1b';
          const out = { startedAt: new Date().toISOString(), steps: [] };
          let token = null;

          const parse = (text) => { try { return JSON.parse(text); } catch { return text; } };
          const cookie = (headers, name) => {
            const values = typeof headers.getSetCookie === 'function' ? headers.getSetCookie() : [headers.get('set-cookie') || ''];
            for (const value of values) {
              const m = value.match(new RegExp(`(?:^|[,;]\\s*)${name}=([^;]+)`));
              if (m) return decodeURIComponent(m[1]);
            }
            return null;
          };
          async function call(method, path, body, options = {}) {
            const headers = { accept: 'application/json', ...(options.headers || {}) };
            if (options.auth !== false && token) headers.authorization = `Bearer ${token}`;
            if (body !== undefined) headers['content-type'] = 'application/json';
            const response = await fetch(`${base}${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'manual',
            });
            const parsed = parse(await response.text());
            return { status: response.status, body: parsed, headers: response.headers };
          }
          const safe = (body) => {
            if (!body || typeof body !== 'object') return body;
            const clone = structuredClone(body);
            for (const key of ['accessToken','refreshToken','mfaToken']) if (key in clone) clone[key] = '[redacted]';
            return clone;
          };

          async function main() {
            const ready = await call('GET', '/ready', undefined, { auth: false });
            out.steps.push({ step: 'ready', status: ready.status, body: safe(ready.body) });

            const csrf = await call('GET', '/auth/csrf', undefined, { auth: false });
            const csrfToken = cookie(csrf.headers, 'csrf_token') || csrf.body?.csrfToken;
            out.steps.push({ step: 'csrf', status: csrf.status, tokenPresent: Boolean(csrfToken) });

            const login = await call('POST', '/auth/login', { login: email, password }, {
              auth: false,
              headers: {
                cookie: `csrf_token=${encodeURIComponent(csrfToken || '')}`,
                'x-csrf-token': csrfToken || '',
              },
            });
            token = login.body?.accessToken || cookie(login.headers, 'access_token');
            out.steps.push({ step: 'login', status: login.status, tokenPresent: Boolean(token), body: safe(login.body) });
            if (!token) throw new Error('login produced no access token');

            const me1 = await call('GET', '/auth/me');
            out.steps.push({ step: 'me-before-bind', status: me1.status, body: safe(me1.body) });

            const bind = await call('POST', `/auth/venue/${venuePath}/session`);
            if (bind.body?.accessToken) token = bind.body.accessToken;
            else {
              const boundCookie = cookie(bind.headers, 'access_token');
              if (boundCookie) token = boundCookie;
            }
            out.steps.push({ step: 'bind', status: bind.status, boundTokenPresent: Boolean(bind.body?.accessToken || cookie(bind.headers, 'access_token')), body: safe(bind.body) });

            const me2 = await call('GET', '/auth/me');
            out.steps.push({ step: 'me-after-bind', status: me2.status, body: safe(me2.body) });

            const deposits = await call('GET', `/growth/reservations/${reservationId}/deposits`);
            out.steps.push({ step: 'deposit-summary', status: deposits.status, body: safe(deposits.body) });
            out.finishedAt = new Date().toISOString();
            out.result = deposits.status >= 200 && deposits.status < 300 ? 'PASS' : 'FAIL';
          }

          main().catch((e) => {
            out.finishedAt = new Date().toISOString();
            out.result = 'FAIL';
            out.error = e instanceof Error ? e.message : String(e);
          }).finally(() => {
            fs.writeFileSync('/tmp/phase8-diagnostic.json', JSON.stringify(out, null, 2));
          });
          NODE

      - name: Post diagnostic result to Phase 8 issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Phase 8 live acceptance diagnostic'
            echo
            echo '```json'
            cat /tmp/phase8-diagnostic.json
            echo '```'
          } > /tmp/phase8-diagnostic-comment.md
          gh issue comment 64 --repo "${{ github.repository }}" --body-file /tmp/phase8-diagnostic-comment.md

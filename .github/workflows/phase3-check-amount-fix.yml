name: Phase 3 check amount compiler fix

on:
  push:
    branches: [phase3-live-operations-v2]
    paths: [.github/workflows/phase3-check-amount-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-live-operations-v2
      - name: Derive open check amount from canonical open venue orders
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/modules/operations/live-operations.service.ts')
          text = p.read_text()
          text = text.replace(
            '    const [orders, guestChecks, customers, memberships] = await Promise.all([',
            '    const [orders, customers, memberships] = await Promise.all([',
            1,
          )
          block = '''      guestCheckIds.length\n        ? this.prisma.guestCheck.findMany({\n            where: { shopId, id: { in: guestCheckIds } },\n            select: { id: true, amountDue: true, currency: true },\n          })\n        : Promise.resolve([]),\n'''
          if block not in text:
              raise SystemExit('guest check query block not found')
          text = text.replace(block, '', 1)
          text = text.replace(
            '    const guestCheckMap = new Map(guestChecks.map((row) => [row.id, row]));\n',
            '',
            1,
          )
          old = '''            openCheckAmountDueMinor: session.guestCheckId\n              ? majorToMinor(guestCheckMap.get(session.guestCheckId)?.amountDue ?? null)\n              : null,\n            openCheckCurrency: session.guestCheckId\n              ? guestCheckMap.get(session.guestCheckId)?.currency ?? session.currency\n              : null,'''
          new = '''            // GuestCheck is the canonical visit container; its live operational amount\n            // is the sum of its still-open canonical VenueOrders. Settlement later owns\n            // discounts, tender and final amount due.\n            openCheckAmountDueMinor: session.guestCheckId ? openOrderAmountMinor : null,\n            openCheckCurrency: session.guestCheckId ? session.currency : null,'''
          if old not in text:
              raise SystemExit('check amount projection block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git diff --check
      - name: Commit patch and remove staging workflow
        run: |
          rm .github/workflows/phase3-check-amount-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/operations/live-operations.service.ts .github/workflows/phase3-check-amount-fix.yml
          git diff --cached --check
          git commit -m "fix(phase3): derive live check amount from open orders"
          git push origin HEAD:phase3-live-operations-v2

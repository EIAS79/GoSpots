name: Phase 8 Vercel credential probe

on:
  push:
    branches:
      - phase8/vercel-prod-promote

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      VERCEL_PRODUCTION_DEPLOY_HOOK: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
      VERCEL_PROD_DEPLOY_HOOK: ${{ secrets.VERCEL_PROD_DEPLOY_HOOK }}
      DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
    steps:
      - name: Check deployment credential presence without disclosure
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ACCESS_TOKEN VERCEL_API_TOKEN VERCEL_DEPLOY_TOKEN VERCEL_DEPLOY_HOOK VERCEL_PRODUCTION_DEPLOY_HOOK VERCEL_PROD_DEPLOY_HOOK DEPLOY_HOOK; do
            if [ -n "${!name:-}" ]; then
              echo "${name}_SET=true"
            else
              echo "${name}_SET=false"
            fi
          done

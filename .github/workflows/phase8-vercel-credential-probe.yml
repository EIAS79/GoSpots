name: Phase 8 Vercel credential probe

on:
  push:
    branches:
      - phase8/vercel-prod-promote

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment credential presence without disclosure
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_SET=true"
          else
            echo "VERCEL_TOKEN_SET=false"
          fi

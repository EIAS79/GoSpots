name: Phase 8 live provider rate-plan setup

on:
  push:
    branches: [main]
    paths:
      - docs/acceptance/phase8-live-provider-rate-plan-trigger.txt

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure temporary resource-scoped Phase 8 rate plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = 'https://www.gospots.eu/api/v1';
          const email = 'p4-31919110371-0vl9xk@gospots.local';
          const password = 'P4-Accept-31919110371!Aa9';
          const venuePath = 'neon-billiard';
          const resourceId = 'cmslhgnus003ica1gxv525gmk';
          const planName = 'Phase 8 Live Acceptance Rate 20260818';
          const out = { startedAt: new Date().toISOString(), resourceId, planName };
          let token = null;
          const parse = (text) => { try { return JSON.parse(text); } catch { return text; } };
          const cookie = (headers, name) => {
            const values = typeof headers.getSetCookie === 'function' ? headers.getSetCookie() : [headers.get('set-cookie') || ''];
            for (const value of values) {
              const m = value.match(new RegExp(`(?:^|[,;]\\s*)${name}=([^;]+)`));
              if (m) return decodeURIComponent(m[1]);
            }
            return null;
          };
          async function call(method, path, body, options = {}) {
            const headers = { accept: 'application/json', ...(options.headers || {}) };
            if (options.auth !== false && token) headers.authorization = `Bearer ${token}`;
            if (body !== undefined) headers['content-type'] = 'application/json';
            const response = await fetch(`${base}${path}`, { method, headers, body: body === undefined ? undefined : JSON.stringify(body), redirect: 'manual' });
            return { status: response.status, body: parse(await response.text()), headers: response.headers };
          }
          async function must(method, path, body, options = {}) {
            const r = await call(method, path, body, options);
            if (r.status < 200 || r.status >= 300) throw new Error(`${method} ${path} -> ${r.status}: ${JSON.stringify(r.body).slice(0,1200)}`);
            return r;
          }
          async function main() {
            const csrf = await must('GET', '/auth/csrf', undefined, { auth: false });
            const csrfToken = cookie(csrf.headers, 'csrf_token') || csrf.body?.csrfToken;
            const login = await must('POST', '/auth/login', { login: email, password }, { auth: false, headers: { cookie: `csrf_token=${encodeURIComponent(csrfToken || '')}`, 'x-csrf-token': csrfToken || '' } });
            token = login.body?.accessToken || cookie(login.headers, 'access_token');
            if (!token) throw new Error('No access token after login');
            const bind = await must('POST', `/auth/venue/${venuePath}/session`);
            token = bind.body?.accessToken || cookie(bind.headers, 'access_token') || token;
            const listed = (await must('GET', '/operations/rate-plans')).body;
            const rows = Array.isArray(listed) ? listed : (listed?.items || listed?.ratePlans || []);
            let plan = rows.find((row) => row?.resourceId === resourceId && row?.active === true);
            if (!plan) {
              plan = (await must('POST', '/operations/rate-plans', {
                name: planName,
                resourceId,
                billingMode: 'HOURLY',
                hourlyRateMinor: 1000,
                roundingMinutes: 1,
                minimumMinutes: 0,
                priority: 100000,
                active: true
              })).body;
              out.created = true;
            } else {
              out.created = false;
            }
            out.ratePlan = { id: plan.id, name: plan.name, resourceId: plan.resourceId, billingMode: plan.billingMode, hourlyRateMinor: plan.hourlyRateMinor, priority: plan.priority, active: plan.active, version: plan.version };
            out.result = 'PASS';
          }
          main().catch((e) => { out.result = 'FAIL'; out.error = e instanceof Error ? e.message : String(e); process.exitCode = 1; }).finally(() => fs.writeFileSync('/tmp/phase8-rate-plan-setup.json', JSON.stringify(out, null, 2)));
          NODE

      - name: Post setup result to Phase 8 issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Phase 8 temporary rate-plan setup'
            echo
            echo '```json'
            cat /tmp/phase8-rate-plan-setup.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment 64 --repo "${{ github.repository }}" --body-file /tmp/comment.md

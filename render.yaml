# GoSpots API — deploy from repo root (https://render.com)
# Web app: deploy apps/web on Vercel (see docs/DEPLOYMENT.md)
services:
  - type: web
    name: gospots-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      npm install -g pnpm@10.12.1 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @gospots/api exec prisma generate &&
      pnpm --filter @gospots/api run build
    startCommand: >-
      cd apps/api &&
      npx prisma migrate deploy &&
      npx prisma db push --accept-data-loss --skip-generate &&
      node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax

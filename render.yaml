# GoSpots API — deploy from repo root (https://render.com)
# Web app: deploy apps/web on Vercel (see docs/DEPLOYMENT.md)
services:
  - type: web
    name: gospots-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      npm install -g pnpm@10.12.1 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @gospots/api exec prisma generate &&
      pnpm --filter @gospots/api run build &&
      test -f apps/api/dist/main.js &&
      pnpm --filter @gospots/api exec prisma migrate deploy
    # Free Render services wake after idle. Keep the wake path to starting Node;
    # migrations run once during deployment instead of on every cold start.
    startCommand: >-
      cd apps/api &&
      node dist/main.js
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
      # Prefer CORS_ORIGINS (comma-separated); CORS_ORIGIN/WEB_* above are merged
      # into the same allowlist for backwards compatibility. No real values here.
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      # Double-submit CSRF for cookie-auth mutations. Keep true with SameSite=lax
      # + Vercel `/api/v1` proxy.
      - key: CSRF_PROTECTION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: GoSpots

      # SaaS billing — Stripe is the explicit production default.
      # Keeping these flags in the Blueprint prevents a deploy from silently
      # falling back to the legacy Lemon checkout path.
      - key: BILLING_ENABLED
        value: "true"
      - key: BILLING_STRIPE_ENABLED
        value: "true"
      - key: BILLING_MOLLIE_ENABLED
        value: "false"
      - key: BILLING_DEFAULT_PROVIDER
        value: STRIPE
      - key: BILLING_LEMON_ENABLED
        value: "false"
      - key: BILLING_LEMON_LEGACY_CHECKOUT
        value: "false"
      - key: BILLING_GRACE_PERIOD_DAYS
        value: "3"
      - key: BILLING_WEBHOOK_MAX_ATTEMPTS
        value: "8"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional. Leave unset to let checkout use inline Stripe price_data.
      - key: STRIPE_PRICE_MAP
        sync: false

      # Mollie stays disabled until deliberately enabled with its API key.
      - key: MOLLIE_API_KEY
        sync: false

      # Lemon Squeezy remains available only as stored legacy configuration;
      # the flags above prevent it from handling new production checkouts.
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_VARIANT_ID
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
